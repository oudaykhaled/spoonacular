name: CI

# Note:
# - SPOONACULAR_API_KEY must be set as a GitHub Repository Secret under
#   Settings > Secrets and variables > Actions > New repository secret.
#   Without it, any task that compiles the network layer will fail at runtime.
# - Instrumentation / UI tests (HiltTestRunner) are NOT run in CI because
#   they require an Android emulator. Run them locally with:
#     ./gradlew allInstrumentedTests
#   or via a dedicated device-farm workflow if one is added in the future.

on:
  push:
    branches: [ main, "fix/**", "feature/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  validate:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run Lint
        working-directory: ing-challenge
        run: ./gradlew lintDevDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: ing-challenge/**/build/reports/lint-results*.html

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Run Detekt
        working-directory: ing-challenge
        run: ./gradlew detekt --stacktrace
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-results
          path: ing-challenge/build/reports/detekt/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Write local.properties
        working-directory: ing-challenge
        run: |
          echo "SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}" >> local.properties
      - name: Run unit tests
        working-directory: ing-challenge
        run: ./gradlew testDevDebugUnitTest --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ing-challenge/**/build/reports/tests/
      - name: Generate JaCoCo coverage report
        working-directory: ing-challenge
        run: ./gradlew jacocoCombinedReport --stacktrace
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ing-challenge/build/reports/jacoco/combined/

  build:
    name: Build (Dev Debug + Prod Release)
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Write local.properties
        working-directory: ing-challenge
        run: |
          echo "SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}" >> local.properties
      - name: Assemble Dev Debug
        working-directory: ing-challenge
        run: ./gradlew assembleDevDebug --stacktrace
      - name: Assemble Prod Release (unsigned)
        working-directory: ing-challenge
        run: ./gradlew assembleProdRelease --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ing-challenge/app/build/outputs/apk/dev/debug/*.apk
            ing-challenge/app/build/outputs/apk/prod/release/*.apk
